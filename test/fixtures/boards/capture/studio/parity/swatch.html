<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>swatch</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../assets/geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      body { margin: 0; padding: 24px; font-family: 'Geist', sans-serif; background: #fafafa; color: #18181b; }
      .row { display: flex; gap: 12px; margin-top: 16px; }
      .row div { width: 64px; height: 64px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <h1>Parity swatch</h1>
    <p>The quick brown fox jumps over the lazy dog, 0123456789.</p>
    <div class="row">
      <div style="background: #ef4444"></div>
      <div style="background: #22c55e"></div>
      <div style="background: #3b82f6"></div>
      <div style="background: linear-gradient(90deg, #f59e0b, #8b5cf6)"></div>
    </div>
  </body>
</html>
