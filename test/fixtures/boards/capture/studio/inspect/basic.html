<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>basic</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../assets/geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      html { background: #f4f4f5; color: #18181b; font-family: 'Geist', sans-serif; }
      html[data-theme='dark'] { background: #18181b; color: #f4f4f5; }
      body { margin: 0; padding: 24px; }
      h1 { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
      .card { padding: 12px; background: #ffffff; }
      #note { margin: 0; color: rgb(255, 0, 0); font-size: 14px; line-height: 20px; }
      .gone { display: none; }
    </style>
  </head>
  <body>
    <h1>Title</h1>
    <section class="card">
      <p id="note">Note</p>
    </section>
    <div class="gone"><span>Hidden</span></div>
    <footer>Footer</footer>
  </body>
</html>
