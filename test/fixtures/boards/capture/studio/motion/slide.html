<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>slide</title>
    <style>
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(200px); } }
      html { background: #ffffff; }
      html[data-theme='dark'] { background: #111111; }
      body { margin: 0; }
      #box { width: 20px; height: 20px; background: #ff0000; animation: slide 2s linear forwards; }
    </style>
  </head>
  <body>
    <div id="box"></div>
  </body>
</html>
