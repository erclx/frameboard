<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>slide</title>
    <style>
      @keyframes slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(800px);
        }
      }
      body {
        margin: 0;
        background: #fff;
      }
      #box {
        width: 40px;
        height: 40px;
        background: #f00;
        animation: slide 4s linear forwards;
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
  </body>
</html>
