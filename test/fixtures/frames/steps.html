<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>steps</title>
  </head>
  <body style="margin: 24px; font-family: sans-serif">
    <h1 data-name="Title" data-step="1">Field notes</h1>
    <p data-name="Subtitle" data-step="1" data-step-effect="fade">Spring</p>
    <p
      data-name="First finding"
      data-step="2"
      data-step-effect="fly"
      data-step-duration="900"
    >
      Less to load
    </p>
    <p
      data-name="Second finding"
      data-step="3"
      data-step-effect="fly"
      data-step-start="after"
      data-step-delay="250"
    >
      Fewer steps
    </p>
    <p
      data-name="A name of forty characters, all of them"
      data-step="4"
      data-step-start="after"
    >
      Nothing to install
    </p>
    <model-viewer
      data-name="Demo model"
      data-step="5"
      data-step-effect="zoom"
      data-step-play
      style="display: block; width: 300px; height: 120px"
    ></model-viewer>
    <p
      data-name="Caption"
      data-step="6"
      data-step-effect="wipe"
      data-step-start="with"
    >
      The demo, unedited
    </p>
    <p data-name="Close" data-step="7" data-step-effect="fade">Questions</p>
  </body>
</html>
