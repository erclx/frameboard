<!doctype html>
<html lang="en" style="--bg:#ececec;--bg2:#ececec;--panel:#ffffff;--ink:#1a1a1a;--muted:#6e6e6e;--accent:#2f7bf0;--line:#e4e4e4">
<head>
<meta charset="utf-8">
<title>arm-5c-light</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:var(--bg);font-family:"Geist Variable","DejaVu Sans",sans-serif;color:var(--ink);overflow:hidden}
.card{position:relative;width:1200px;height:630px;padding:96px 96px 0}
.lock{display:flex;align-items:center;gap:28px}
.mark svg{display:block;width:112px;height:112px}
.word{font-size:84px;font-weight:700;letter-spacing:-.035em}
.tag{margin-top:36px;font-size:34px;color:var(--muted);max-width:820px;line-height:1.3}
.sizes{position:absolute;right:96px;bottom:150px;display:flex;align-items:flex-end;gap:22px}
.sizes svg{display:block}
.arm{position:absolute;left:96px;right:96px;bottom:40px;padding-top:18px;border-top:1px solid var(--line);font-size:20px;color:var(--muted)}
.arm b{color:var(--ink)}
</style>
</head>
<body>
<div class="card">
  <div class="lock"><div class="mark"><svg viewBox="0 0 64 64"><rect x="4" y="12" width="48" height="48" rx="12" fill="var(--accent)"/><rect x="34" y="4" width="26" height="26" rx="7" fill="var(--ink)" stroke="var(--bg2)" stroke-width="4"/></svg></div><div class="word">Frameboard</div></div>
  <p class="tag">A design board your coding agent draws on.</p>
  <div class="sizes"><svg width="16" height="16" viewBox="0 0 64 64"><rect x="4" y="12" width="48" height="48" rx="12" fill="var(--accent)"/><rect x="34" y="4" width="26" height="26" rx="7" fill="var(--ink)" stroke="var(--bg2)" stroke-width="4"/></svg><svg width="32" height="32" viewBox="0 0 64 64"><rect x="4" y="12" width="48" height="48" rx="12" fill="var(--accent)"/><rect x="34" y="4" width="26" height="26" rx="7" fill="var(--ink)" stroke="var(--bg2)" stroke-width="4"/></svg><svg width="64" height="64" viewBox="0 0 64 64"><rect x="4" y="12" width="48" height="48" rx="12" fill="var(--accent)"/><rect x="34" y="4" width="26" height="26" rx="7" fill="var(--ink)" stroke="var(--bg2)" stroke-width="4"/></svg></div>
  <div class="arm"><b>Arm 5c, Frame on a board.</b> 4a rebalanced: a big blue board with a small solid frame sitting on its corner. Less like a layers icon.</div>
</div>

</body>
</html>
