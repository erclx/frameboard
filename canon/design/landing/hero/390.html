<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hero 390</title>
    <link rel="stylesheet" href="../../assets/landing-v2/index.CQTpjJSt.css" />
    <style>
      body {
        padding-top: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="wrap" id="hero">
        <div class="pt-10 pb-12 text-center sm:pt-[72px] sm:pb-16 lg:pb-24">
          <h1>The design board your agent draws on</h1>
          <p class="lead mx-auto">
            Your agent writes each screen as a plain HTML file. You see it the
            moment it lands, and tweak it by hand.
          </p>
          <div class="flex justify-center">
            <div
              class="inline-flex items-center gap-4 rounded-lg bg-accent px-4 py-3.5 font-mono text-[14px] text-on-accent min-[361px]:gap-[18px] min-[361px]:px-[18px] min-[361px]:text-[16px]"
              data-copy=""
            >
              <code class="font-mono whitespace-nowrap select-all"
                >npx frameboard serve</code
              ><button
                class="cursor-pointer border-0 bg-transparent p-0 font-sans text-[13px] text-on-accent underline-offset-3 hover:underline focus-visible:underline focus-visible:outline-on-accent"
                type="button"
              >
                Copy</button
              ><span class="sr-only" role="status"></span>
            </div>
          </div>
          <div class="shot group relative mt-9 sm:mt-14" data-film="">
            <picture
              ><source
                media="(prefers-color-scheme: dark)"
                srcset="../../assets/landing-v2/hero-still-dark.png" />
              <img
                class="aspect-[880/587] object-cover"
                src="../../assets/landing-v2/hero-still.png"
                width="880"
                height="587"
                alt="The board canvas as an agent draws a landing page and two phone screens" /></picture
            ><a
              class="absolute top-1/2 left-1/2 flex size-14 -translate-1/2 items-center justify-center rounded-full bg-accent text-on-accent focus-visible:outline-fg sm:size-[72px]"
              href="/film.mp4"
              aria-label="Play the film, 78 seconds"
              data-play=""
              ><svg
                viewBox="0 0 20 24"
                width="20"
                height="24"
                fill="currentColor"
                class="ml-1"
                aria-hidden="true"
              >
                <path d="M0 0l20 12L0 24z"></path></svg></a
            ><button
              type="button"
              class="absolute top-[18px] right-[18px] inline-flex h-[30px] cursor-pointer items-center gap-1.5 rounded-md border border-line bg-panel px-2.5 font-sans text-[13px] text-fg"
              hidden=""
              data-close=""
            >
              <svg
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M4 4l8 8M12 4l-8 8"></path></svg
              >Close
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
