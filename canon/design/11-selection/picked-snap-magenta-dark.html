<!doctype html>
<html lang="en" style="--canvas:#1f1f1f;--panel:#2a2a2a;--raised:#363636;--hover:#323232;--sel:#3d3d3d;--border:#353535;--text:#e6e6e6;--muted:#949494;--faint:#6b6b6b;--accent:#4e92f6;--accentfg:#ffffff;--claim:#e0a3ff;--note:#f5b84a;--destructive:#ff6b6b;--good:#5fc48a;--guide:#ff4fa3">
<head>
<meta charset="utf-8">
<title>picked-snap-magenta-dark</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Geist Variable","DejaVu Sans",sans-serif;font-size:12px;color:var(--text);background:var(--canvas);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
.ic{flex:none;display:block}
.app{display:grid;height:100%;grid-template-columns:240px auto 1fr 240px}
.app.floating{grid-template-columns:240px 1fr 240px}
.app.bare{grid-template-columns:1fr}
.left,.right{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.right{border-right:0;border-left:1px solid var(--border)}
.phead{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;border-bottom:1px solid var(--border)}
.pname{flex:1;font-weight:600;font-size:13px}
.ib{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--muted)}
.ib.sm{width:20px;height:20px}
.tabs{display:flex;margin:8px;padding:2px;background:var(--raised);border-radius:7px}
.tabs button{flex:1;height:24px;border-radius:5px;color:var(--muted);font-weight:500}
.tabs .on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;color:var(--muted);font-weight:600;font-size:11px}
.hr{height:1px;background:var(--border);margin:6px 0}
.row{display:flex;align-items:center;gap:6px;height:26px;padding-right:8px;margin:0 6px;border-radius:6px;color:var(--text)}
.row .tw{width:10px;color:var(--faint)}
.row .ic{color:var(--muted)}
.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel{background:var(--sel)}
.selband{margin:0 6px;border-radius:6px;overflow:hidden}
.selband .row{margin:0;border-radius:0}
.row.inband{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.row.selrow{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.row.child{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.row.selrow .ic{color:var(--accent)}
.eyebtn{position:relative;display:grid;place-items:center;width:20px;height:20px;margin:-3px -3px;border-radius:5px;background:var(--sel);color:var(--text)}
.tip{position:absolute;left:50%;top:26px;transform:translateX(-50%);white-space:nowrap;padding:5px 8px;border-radius:6px;background:var(--text);color:var(--panel);font-size:11px;z-index:9;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.row.hov{background:var(--hover)}
.row.hidden .nm,.row.hidden .ic{color:var(--faint)}
.acts{display:flex;gap:6px;color:var(--muted)}
.acts.on{color:var(--muted)}
.dock{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--panel);border-right:1px solid var(--border);width:44px}
.dock .sep{width:20px;height:1px;background:var(--border);margin:6px 0}
.tb{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;color:var(--text)}
.tb.on{background:var(--accent);color:var(--accentfg)}
.pill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.12);z-index:5}
.pill .sep{width:1px;height:20px;background:var(--border);margin:0 5px}
.seg{display:flex;padding:2px;background:var(--raised);border-radius:8px}
.seg button{display:flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;color:var(--muted);font-weight:500}
.seg .on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.canvas{position:relative;background:var(--canvas);overflow:hidden}
.flabel{position:absolute;color:var(--muted);font-size:11px;white-space:nowrap}
.flabel.claim{color:var(--claim)}
.sess{margin-left:6px;padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--claim) 18%,transparent);font-weight:500}
.frame{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.frame.selected{outline:1.5px solid var(--accent)}
.framesel{position:absolute;outline:1.5px solid var(--accent);pointer-events:none;z-index:3}
.guide{position:absolute;background:var(--guide);z-index:4}.h-g{height:1px}.v-g{width:1px}
.gap-tag{position:absolute;transform:translateX(-50%);background:var(--guide);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;z-index:4;margin-left:19px}
.frame.dragging{opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.35);outline:1.5px solid var(--accent)}
.frame.touched{outline:1.5px solid var(--accent)}
.marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);z-index:3}
.frame.parentsel{outline:1px dashed var(--accent);outline-offset:1px}
.elsel{position:relative;outline:1.5px solid var(--accent);outline-offset:2px}
.frame.claimed{outline:1.5px dashed var(--claim);outline-offset:3px}
.h{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--accent)}
.tl{left:-4px;top:-4px}.tr{right:-4px;top:-4px}.bl{left:-4px;bottom:-4px}.br{right:-4px;bottom:-4px}
.dim{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);background:var(--accent);color:var(--accentfg);font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.pin{position:absolute;width:22px;height:22px;border-radius:11px 11px 11px 2px;background:var(--note);color:#1a1a1a;font-size:11px;font-weight:600;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--muted)}
.zoomctl span{color:var(--text);font-variant-numeric:tabular-nums}
.mock-hw{padding:28px}.mock-hw i{display:block;width:28px;height:4px;background:#f97316;margin-bottom:14px}.mock-hw b{font:700 30px/1 "Geist Variable",sans-serif;color:#111827;letter-spacing:-.02em}.mock-hw>span{display:block;margin-top:14px;height:6px;width:70%;background:#e5e7eb;border-radius:3px}
.mock-sw{padding:12px}.mock-sw em{font-style:normal;font-size:10px;color:#111827;font-weight:600}.mock-sw .elsel,.mock-sw .row-sw{display:flex;gap:10px;margin-top:8px}
.tsel{display:inline-block}.mock-sw i{flex:1;height:52px;border-radius:6px}
.mock-pr{padding:20px}.mock-pr b{font:700 20px/1 "Geist Variable",sans-serif;color:#111827}.mock-pr div{display:flex;gap:8px;margin-top:16px}.mock-pr i{flex:1;height:120px;border:1px solid #e5e7eb;border-radius:8px}
.mock-sun{height:100%;background:linear-gradient(#3b2a5c,#e07a5f 55%,#1d2a4a 56%,#0f1730)}
.rtop{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 12px;border-bottom:1px solid var(--border)}
.who{display:grid;place-items:center;width:22px;height:22px;border-radius:11px;background:var(--text);color:var(--panel);font-weight:700;font-size:10px}
.zoom{display:flex;align-items:center;gap:4px;color:var(--muted)}
.isec{padding:10px 12px 12px;border-bottom:1px solid var(--border)}
.ihead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px;color:var(--text)}
.ihead .ic{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fld{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;background:var(--raised);border-radius:6px}
.fld.wide{margin-bottom:6px}
.fld .k{color:var(--faint);min-width:10px}
.fld .v{color:var(--text);font-variant-numeric:tabular-nums}
.txtarea{min-height:44px;padding:6px 8px;background:var(--raised);border-radius:6px;line-height:1.4}
.alrow{display:flex;flex-wrap:wrap;gap:6px}
.align{display:flex;gap:2px;margin-top:6px;padding:2px;background:var(--raised);border-radius:6px;width:max-content}
.align button{display:grid;place-items:center;width:28px;height:22px;border-radius:5px;color:var(--muted)}
.align .on{background:var(--panel);color:var(--text)}
.crow{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;background:var(--raised);border-radius:6px;margin-top:6px}
.crow .sw{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.crow .tok{flex:1;padding:1px 6px;margin-left:-4px;border-radius:4px;background:color-mix(in srgb,var(--text) 9%,transparent);max-width:max-content}
.crow .hex{flex:1;font-variant-numeric:tabular-nums}
.crow .tok+.pct,.crow .hex+.pct{margin-left:auto}
.crow .pct{color:var(--muted)}
.crow .ic{color:var(--muted)}
.crow .flag{color:var(--note)}
.floatname{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;font-weight:600;font-size:13px;z-index:5}
.floatname .ib{width:24px;height:24px}
.floatzoom{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 6px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-variant-numeric:tabular-nums;z-index:5}

.home{display:grid;grid-template-rows:56px 1fr;height:100%;background:var(--canvas)}
.htop{display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{font-weight:600;font-size:14px;flex:1;display:flex;align-items:center;gap:8px}
.mark{width:18px;height:18px;border-radius:5px;background:var(--accent)}
.btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accentfg)}
.btn.ghost{background:var(--raised)}
.btn.danger{background:var(--destructive);color:#fff}
.vt{display:flex;padding:2px;background:var(--raised);border-radius:8px}
.vt button{display:grid;place-items:center;width:28px;height:26px;border-radius:6px;color:var(--muted)}
.vt .on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.hbody{padding:32px 48px;overflow:hidden}
.hbody h1{font-size:20px;font-weight:600;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card.hov{box-shadow:0 0 0 2px var(--accent)}
.thumb{height:150px;background:var(--canvas);margin:6px;border-radius:8px;position:relative;overflow:hidden}
.thumb i{position:absolute;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.cmeta{padding:6px 12px 12px}.cmeta b{display:block;font-weight:600;font-size:13px}.cmeta span{color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.lrow{display:grid;grid-template-columns:48px 1fr 160px 160px;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow.head{height:36px;color:var(--muted);font-weight:600;font-size:11px}
.lrow.hov{background:var(--hover)}
.lrow .mini{width:32px;height:22px;border-radius:4px;background:var(--canvas);position:relative}
.lrow .mini i{position:absolute;left:5px;top:5px;width:9px;height:12px;background:#fff}.lrow .mini i+i{left:17px}
.lrow span{color:var(--muted)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:10}
.light-scrim{background:rgba(0,0,0,.18)}
.dialog{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:560px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.35);z-index:11;overflow:hidden}
.dsearch{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-bottom:1px solid var(--border);font-size:14px}
.dsearch .ph{color:var(--text)}.dsearch .caret{width:1px;height:18px;background:var(--accent);margin-left:-8px}
.grp{padding:8px}
.glabel{padding:6px 8px;color:var(--muted);font-size:11px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:7px}
.item .ic{color:var(--muted)}
.item.on{background:var(--sel)}
.item .nm{flex:1}
.kbd{display:flex;gap:3px}.kbd span{min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--raised);color:var(--muted);font-size:11px;display:grid;place-items:center}
.item .where{color:var(--muted)}
.ttab .tokgrp{padding:4px 0 8px}
.trow{display:grid;grid-template-columns:1fr 18px 18px;gap:6px;align-items:center;height:28px;margin:0 6px;padding:0 6px;border-radius:6px}
.trow:hover{background:var(--hover)}
.trow .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tn em{font-style:normal;color:var(--faint)}
.tsw{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.thead{display:grid;grid-template-columns:1fr 18px 18px;gap:6px;padding:4px 12px 4px 12px;color:var(--faint);font-size:10px}
.tsrc{margin:4px 12px 8px;padding:8px 10px;border-radius:8px;background:var(--raised);color:var(--muted);line-height:1.45}
.tsrc code{font-family:"Noto Sans Mono","DejaVu Sans Mono",monospace;font-size:11px;color:var(--text)}
.empty{margin:12px;padding:16px;border:1px dashed var(--border);border-radius:10px;color:var(--muted);line-height:1.5}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.empty code{font-family:"Noto Sans Mono","DejaVu Sans Mono",monospace;font-size:11px;color:var(--text)}
.thread{position:absolute;width:320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:6;overflow:hidden}
.thtop{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600}
.thtop .on{margin-left:auto;color:var(--muted);font-weight:400;display:flex;align-items:center;gap:6px}
.msg{padding:10px 12px;display:flex;gap:10px}
.av{flex:none;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:10px;font-weight:700}
.av.me{background:var(--text);color:var(--panel)}.av.ag{background:color-mix(in srgb,var(--claim) 25%,transparent);color:var(--claim)}
.msg b{font-weight:600}.msg time{color:var(--faint);margin-left:6px}.msg p{margin-top:2px;line-height:1.45}
.compose{margin:6px 12px 12px;border:1px solid var(--border);border-radius:8px;padding:8px}
.compose .ph{color:var(--faint);height:28px}
.cbar{display:flex;align-items:center;gap:8px}
.chip{white-space:nowrap;display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:6px;background:var(--raised);color:var(--text)}
.dotl{width:7px;height:7px;border-radius:4px;background:var(--claim)}
.cbar .btn{margin-left:auto;height:26px}
.listen{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tswitch{display:inline-flex;margin-left:6px;vertical-align:-3px;color:var(--muted)}
.menu{position:absolute;width:220px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:6}
.mi{display:flex;align-items:center;height:28px;padding:0 8px;border-radius:6px}
.mi .kbd{margin-left:auto}
.mi.on{background:var(--hover)}
.rsz{position:fixed;top:0;bottom:0;width:3px;background:var(--accent);z-index:8}
.rsztip{position:fixed;top:412px;padding:4px 8px;border-radius:6px;background:var(--text);color:var(--panel);font-size:11px;z-index:8;white-space:nowrap}
.cur{position:fixed;z-index:9}
.mhead{display:flex;gap:10px;align-items:center;padding:8px}.mhead b{display:block;font-weight:600}.mhead span:not(.av){color:var(--muted);font-size:11px}
.mval{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted)}
.mi.danger{color:var(--destructive)}
.msep{height:1px;background:var(--border);margin:4px 0}
.toast{position:absolute;right:16px;bottom:16px;width:340px;display:flex;gap:10px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:6}
.toast .ic{color:var(--note);margin-top:1px}
.toast b{display:block;font-weight:600;margin-bottom:2px}.toast span{color:var(--muted);line-height:1.45}
.toast2{bottom:96px}.toast2 .ic{color:var(--good)}
.pill{left:calc(240px + (100% - 480px)/2)}</style>
</head>
<body>
<div class="app floating"><aside class="left">
  <div class="phead"><button class="ib" title="Home"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button><span class="pname">Diligent kite</span><button class="ib" title="Hide UI ⌘\"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
  <div class="tabs"><button class="on">Design</button><button>Theme</button></div>
  <div class="sec"><span>Pages</span><button class="ib sm"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="row sel" style="padding-left:8px"><span class="tw"></span><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="nm">Playground</span></div>
  <div class="row " style="padding-left:8px"><span class="tw"></span><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="nm">Canon</span></div>
  <div class="hr"></div>
  <div class="sec"><span>Layers</span><button class="ib sm" title="Collapse all layers"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h10M4 18h7M17 9l2.5-3L22 9M17 15l2.5 3 2.5-3"/></svg></button></div>
