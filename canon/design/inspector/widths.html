<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>widths-control-chips-720</title>
    <style>
      :root {
        --canvas: #ececec;
        --panel: #fff;
        --raised: #f2f2f2;
        --border: #e4e4e4;
        --text: #1a1a1a;
        --muted: #6e6e6e;
        --faint: #a5a5a5;
        --accent: #2f7bf0;
        --accentfill: #1f6fe5;
        --accentfg: #fff;
        --frame: #fff;
      }
      [data-theme='dark'] {
        --canvas: #1f1f1f;
        --panel: #2a2a2a;
        --raised: #363636;
        --border: #3a3a3a;
        --text: #e6e6e6;
        --muted: #a0a0a0;
        --faint: #6b6b6b;
        --accent: #4e92f6;
        --accentfill: #2068dc;
        --accentfg: #fff;
        --frame: #262626;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: Geist, 'Noto Sans', 'DejaVu Sans', sans-serif;
        font-size: 12px;
        color: var(--text);
        background: var(--canvas);
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        overflow: hidden;
        width: 720px;
        height: 400px;
        background: var(--canvas);
      }
      .cap {
        position: absolute;
        left: 16px;
        top: 12px;
        right: 16px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
      }
      .cap b {
        color: var(--text);
        font-weight: 600;
      }
      .abs {
        position: absolute;
      }
      .flabel {
        position: absolute;
        color: var(--muted);
        font-size: 11px;
      }
      .frame {
        position: absolute;
        background: var(--frame);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
      }
      .sel {
        outline: 1.5px solid var(--accent);
      }
      .dash {
        outline: 1px dashed var(--accent);
      }
      .vid {
        position: absolute;
        background: linear-gradient(
          160deg,
          #0f172a 0%,
          #1e3a5f 35%,
          #0d9488 70%,
          #334155 100%
        );
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 15px;
        letter-spacing: 0.01em;
      }
      .vid small {
        display: block;
        font-size: 8px;
        opacity: 0.6;
        text-align: center;
        margin-top: 2px;
      }
      .aud {
        position: absolute;
        height: 26px;
        border-radius: 13px;
        background: var(--raised);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 9px;
        color: var(--muted);
        font-size: 9px;
      }
      .tile {
        position: absolute;
        width: 92px;
        height: 82px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 5px;
        font-size: 10px;
        color: var(--text);
      }
      .tile i {
        display: block;
        height: 48px;
        border-radius: 5px;
        background: linear-gradient(160deg, #0f172a, #1e3a5f 40%, #0d9488);
        margin-bottom: 4px;
      }
      .tile.drag {
        opacity: 0.85;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        transform: rotate(-3deg);
      }
      .ghost {
        position: absolute;
        border: 1.5px dashed var(--accent);
        background: color-mix(in srgb, var(--accent) 10%, transparent);
        border-radius: 2px;
        color: var(--accent);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 500;
      }
      .chip {
        position: absolute;
        padding: 2px 7px;
        border-radius: 4px;
        background: var(--accentfill);
        color: #fff;
        font-size: 10px;
        font-weight: 500;
        white-space: nowrap;
      }
      .hint {
        position: absolute;
        padding: 5px 10px;
        border-radius: 7px;
        background: rgba(30, 30, 30, 0.86);
        color: #eee;
        font-size: 11px;
        white-space: nowrap;
      }
      .toast {
        position: absolute;
        right: 16px;
        bottom: 16px;
        padding: 9px 12px;
        border-radius: 9px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        font-size: 11px;
        line-height: 1.4;
      }
      .toast b {
        display: block;
        font-weight: 600;
      }
      .toast span {
        color: var(--muted);
      }
      .cur {
        position: absolute;
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 13px solid var(--text);
        transform: rotate(-30deg);
      }
      .nodrop {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 8px;
        border: 2px solid #d92d2d;
        background: var(--panel);
      }
      .nodrop:after {
        content: '';
        position: absolute;
        left: 1px;
        right: 1px;
        top: 5px;
        height: 2px;
        background: #d92d2d;
        transform: rotate(45deg);
      }
      .bar {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 6px;
        border-radius: 6px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        color: var(--text);
      }
      .bar.onvid {
        background: rgba(20, 20, 20, 0.72);
        border-color: transparent;
        color: #fff;
        box-shadow: none;
        backdrop-filter: blur(6px);
      }
      .bar .b {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .bar .t {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: color-mix(in srgb, currentColor 25%, transparent);
        position: relative;
        min-width: 20px;
      }
      .bar .t u {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 28%;
        background: var(--accent);
        border-radius: 2px;
      }
      .bar .t s {
        position: absolute;
        left: 28%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border-radius: 5px;
        background: var(--accent);
      }
      .bar .t.ringall {
        outline: 2px solid #fff;
        outline-offset: 5px;
        border-radius: 3px;
      }
      .bar .t.ringthumb s {
        box-shadow:
          0 0 0 2px var(--panel),
          0 0 0 3.5px var(--accent);
      }
      .bar .tm {
        font:
          10px ui-monospace,
          'DejaVu Sans Mono',
          monospace;
        color: inherit;
        opacity: 0.7;
        white-space: nowrap;
      }
      .play {
        width: 0;
        height: 0;
        border-left: 7px solid currentColor;
        border-top: 4.5px solid transparent;
        border-bottom: 4.5px solid transparent;
      }
      .pause {
        width: 7px;
        height: 9px;
        border-left: 2.5px solid currentColor;
        border-right: 2.5px solid currentColor;
      }
      .spk {
        width: 9px;
        height: 8px;
        background: currentColor;
        clip-path: polygon(0 30%, 40% 30%, 100% 0, 100% 100%, 40% 70%, 0 70%);
      }
      .insp {
        position: absolute;
        right: 0;
        top: 40px;
        bottom: 0;
        width: 190px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        border-top: 1px solid var(--border);
        padding: 12px;
        font-size: 11px;
      }
      .insp h4 {
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .insp .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 24px;
        color: var(--text);
      }
      .sw {
        width: 22px;
        height: 13px;
        border-radius: 7px;
        background: var(--faint);
        position: relative;
      }
      .sw:after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 9px;
        height: 9px;
        border-radius: 5px;
        background: #fff;
      }
      .sw.on {
        background: var(--accentfill);
      }
      .sw.on:after {
        left: 11px;
      }
      .new {
        color: var(--accent);
        font-weight: 600;
        font-size: 9px;
        margin-left: 5px;
      }
      .native {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 26px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 8px;
        color: #fff;
        font-size: 9px;
      }
      .native .t {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.35);
        position: relative;
      }
      .native .t u {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 28%;
        background: #fff;
        border-radius: 2px;
      }
      .pill {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        display: flex;
        gap: 2px;
        padding: 3px;
        background: var(--raised);
        border-radius: 8px;
        font-size: 11px;
      }
      .pill span {
        padding: 4px 9px;
        border-radius: 6px;
        color: var(--muted);
      }
      .pill .on {
        background: var(--accentfill);
        color: #fff;
      }

      .stage {
        height: 420px;
      }
      .lab {
        position: absolute;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      kbd {
        font:
          10px ui-monospace,
          'DejaVu Sans Mono',
          monospace;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        color: var(--text);
        margin-left: 3px;
      }
      .sheet {
        position: absolute;
        left: 40px;
        right: 40px;
        top: 56px;
        bottom: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        font-size: 11px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px 26px;
        align-content: start;
      }
      .sheet h4 {
        font-size: 11px;
        font-weight: 600;
        margin: 4px 0 6px;
        color: var(--text);
      }
      .sheet .r {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 22px;
        color: var(--muted);
      }
      .sheet .new {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border-radius: 5px;
        margin: 0 -6px;
        padding: 0 6px;
        color: var(--text);
      }
      .insp {
        position: absolute;
        left: 230px;
        top: 56px;
        width: 240px;
        bottom: 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        font-size: 11px;
      }
      .insp h4 {
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .fl {
        color: var(--muted);
        margin: 8px 0 5px;
        display: flex;
        justify-content: space-between;
      }
      .row2 {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .segi {
        display: flex;
        padding: 2px;
        background: var(--raised);
        border-radius: 7px;
      }
      .segi span {
        width: 26px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        color: var(--muted);
      }
      .segi .on {
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--border);
      }
      .fld {
        height: 26px;
        border-radius: 6px;
        background: var(--raised);
        display: flex;
        align-items: center;
        padding: 0 8px;
        flex: 1;
        gap: 6px;
      }
      .chip2 {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 7px;
        border-radius: 6px;
        background: var(--raised);
        font-variant-numeric: tabular-nums;
      }
      .chip2 i {
        color: var(--muted);
        font-style: normal;
      }
      .addb {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1px dashed var(--faint);
        color: var(--muted);
      }
      .pinb {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--accent);
        font-weight: 500;
      }
      .newt {
        color: var(--accent);
        font-weight: 600;
        font-size: 9px;
        margin-left: 5px;
      }
      .cv {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        bottom: 0;
      }
      .fr {
        position: absolute;
        background: var(--frame);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 650;
        color: var(--accent);
      }
      .fr small {
        position: absolute;
        left: 0;
        top: -16px;
        font-size: 10px;
        font-weight: 400;
        color: var(--muted);
      }
      .full {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        bottom: 0;
        background: #0b0c0e;
      }
      .card {
        position: absolute;
        background: var(--frame);
        border-radius: 2px;
        padding: 9%;
        color: var(--text);
      }
      .card b {
        display: block;
        font-weight: 650;
      }
      .card span {
        color: var(--muted);
      }
      .tag {
        position: absolute;
        right: 16px;
        top: 56px;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(30, 30, 30, 0.86);
        color: #ddd;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="cap">
        <b>widths-control-chips-720</b> · v28.9: a Widths row lists each linked
        width as a chip with a remove mark, and a plus opens the device list to
        add one
      </div>
      <div class="insp">
        <h4>Frame</h4>
        <div class="fl"><span>Preview</span></div>
        <div class="row2">
          <div class="segi">
            <span class="on">▯</span><span>▭</span><span>▬</span>
          </div>
          <div class="fld">↔ 390</div>
        </div>
        <div class="fl" style="margin-top: 14px">
          <span>Also shows at<span class="newt">new</span></span>
        </div>
        <div class="row2" style="flex-wrap: wrap">
          <span class="chip2">834 <i>×</i></span
          ><span class="chip2">390 <i>×</i></span
          ><span class="addb">+</span>
        </div>
        <div class="fl" style="margin-top: 10px; font-size: 10px">
          Each is drawn beside the frame from the same file.
        </div>
      </div>
    </div>
  </body>
</html>
