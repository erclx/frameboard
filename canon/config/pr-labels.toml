[domains.cli]
paths = ["src/cli/"]
color = "1f6feb"

[domains.server]
paths = ["src/server/"]
color = "2da44e"

[domains.client]
paths = ["src/client/", "src/frame-bridge/"]
color = "a371f7"

[domains.shared]
paths = ["src/shared/"]
color = "d29922"

[domains.web]
paths = ["web/"]
color = "bf3989"

[domains.plugin]
paths = [
  "plugins/frameboard/skills/",
  "plugins/frameboard/hooks/",
  "plugins/frameboard/monitors/",
  "plugins/frameboard/lib/",
  ".claude-plugin/",
]
color = "0598bc"

[domains.design]
paths = ["canon/design/", "canon/DESIGN.md"]
color = "e16f24"

[domains.documentation]
paths = [
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "docs/",
  "canon/REQUIREMENTS.md",
  "canon/context/",
  "canon/drive/",
  ".github/ISSUE_TEMPLATE/",
  ".github/pull_request_template.md",
  ".github/social-card.png",
  ".github/readme-hero-",
  ".github/readme-themes/",
]
color = "6e7781"

[domains.tests]
paths = [
  "e2e/",
  "test/",
  "src/test/",
  "playwright.config.ts",
  "vitest.config.ts",
]
color = "56d364"

[domains.ci]
paths = [
  ".github/workflows/",
  ".github/dependabot.yml",
  "release-please-config.json",
]
color = "d2a8ff"

[domains.tooling]
paths = [
  "scripts/",
  ".husky/",
  ".lintstagedrc",
  ".oxfmtrc.json",
  ".oxlintrc.json",
  ".prettierignore",
  ".gitignore",
  ".gitattributes",
  "commitlint.config.js",
  "components.json",
  "rolldown.config.ts",
  "tsconfig.json",
  "vite.config.ts",
  "bun.lock",
]
color = "79c0ff"

[domains.claude]
paths = [".claude/", "CLAUDE.md", "canon/config/"]
color = "ffa657"

[declined]
release-managed = [
  "CHANGELOG.md",
  "package.json",
  ".release-please-manifest.json",
  "plugins/frameboard/.claude-plugin/plugin.json",
]
