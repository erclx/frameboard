<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample</title>
    <style>
      .stage {
        position: relative;
        width: 480px;
        height: 300px;
        overflow: hidden;
      }
      .kit-note {
        position: absolute;
        top: 36px;
        left: 28px;
        width: 120px;
      }
      .kit-note h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      .kit-note p {
        margin: 0;
        font-size: 15px;
        line-height: 1.3;
      }
      .arrow {
        position: absolute;
        top: 96px;
        left: 172px;
        width: 68px;
        height: 32px;
      }
      .kit-card {
        position: absolute;
        top: 48px;
        left: 246px;
        width: 186px;
      }
      .kit-card h3 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      .kit-card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="kit-note">
        <h2>Idea</h2>
        <p>Every agent keeps one look</p>
      </section>
      <svg class="arrow" viewBox="0 0 72 32" aria-hidden="true">
        <path class="kit-line" d="M4 24 C24 4, 48 4, 66 16" />
        <path class="kit-line" d="M56 9 L67 16 L57 23" />
      </svg>
      <article class="kit-card">
        <h3>Install a kit</h3>
        <p class="kit-muted">Tokens, styles, and sample frames.</p>
        <div class="actions">
          <button class="kit-button kit-primary">Install</button>
          <button class="kit-button">Preview</button>
        </div>
      </article>
    </main>
  </body>
</html>
