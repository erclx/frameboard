<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>inbox</title>
    <style>
      body {
        margin: 0;
        padding: 64px 24px 24px;
        display: grid;
        gap: 24px;
        background: var(--surface);
        color: var(--text);
        font-family: var(--font-text);
      }
      /* The inner screen is 890 wide and the cover 466, so the page splits between them. */
      @media (min-width: 700px) {
        body {
          grid-template-columns: 1fr 1fr;
        }
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 12px 0;
        font-size: 16px;
        box-shadow: inset 0 -1px 0 var(--border);
      }
      article {
        padding: 20px;
        border-radius: 16px;
        box-shadow: inset 0 0 0 1px var(--border);
      }
      h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 16px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <section data-name="List">
      <h1>Inbox</h1>
      <ul>
        <li>Design review moved to Thursday</li>
        <li>Your export is ready</li>
        <li>Three new notes on the home page</li>
        <li>Welcome to the board</li>
      </ul>
    </section>
    <article data-name="Message">
      <h2>Design review moved to Thursday</h2>
      <p>The room is booked from two, and the deck opens on the fold demo.</p>
    </article>
  </body>
</html>
