<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>slide</title>
    <style>
      @keyframes slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(1000px);
        }
      }
      body {
        margin: 0;
        height: 900px;
        display: grid;
        align-items: center;
        padding: 0 120px;
        background: var(--surface);
      }
      [data-name='Box'] {
        width: 160px;
        height: 160px;
        border-radius: 24px;
        background: var(--text);
        animation: slide 4s linear forwards;
      }
    </style>
  </head>
  <body>
    <div data-name="Box"></div>
  </body>
</html>
