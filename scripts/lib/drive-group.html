<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>group</title>
  </head>
  <body
    style="
      position: relative;
      margin: 0;
      height: 900px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-text);
      font-size: 24px;
    "
  >
    <div
      data-name="Rectangle"
      style="
        position: absolute;
        left: 520px;
        top: 120px;
        width: 180px;
        height: 180px;
        background: var(--muted);
      "
    ></div>
    <div
      data-name="Ellipse"
      style="
        position: absolute;
        left: 160px;
        top: 340px;
        width: 340px;
        height: 180px;
        border-radius: 50%;
        background: var(--muted);
      "
    ></div>
    <p
      data-name="First"
      style="position: absolute; left: 160px; top: 640px; margin: 0"
    >
      Text
    </p>
    <p
      data-name="Second"
      style="position: absolute; left: 280px; top: 640px; margin: 0"
    >
      Col 2
    </p>
    <p data-name="Flowing" style="margin: 0; padding: 40px 160px">
      In the flow
    </p>
  </body>
</html>
