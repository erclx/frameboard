<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>02-build</title>
  </head>
  <body
    style="
      margin: 0;
      height: 720px;
      padding: 96px 112px;
      box-sizing: border-box;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-text);
    "
  >
    <p
      data-name="Kicker"
      style="margin: 0; color: var(--accent); font-size: 24px"
    >
      How a slide builds
    </p>
    <h1 data-name="Title" style="margin: 16px 0 48px; font-size: 72px">
      One press, one step.
    </h1>
    <p
      data-name="First"
      data-step="1"
      style="
        margin: 0;
        padding: 20px 0;
        border-top: 1px solid var(--border);
        font-size: 32px;
      "
    >
      Mark an element with a step.
    </p>
    <p
      data-name="Second"
      data-step="2"
      data-step-effect="fly"
      style="
        margin: 0;
        padding: 20px 0;
        border-top: 1px solid var(--border);
        font-size: 32px;
      "
    >
      The arrows reveal each in order.
    </p>
    <p
      data-name="Third"
      data-step="3"
      data-step-effect="fade"
      style="
        margin: 0;
        padding: 20px 0;
        border-top: 1px solid var(--border);
        font-size: 32px;
      "
    >
      The slide moves on after the last.
    </p>
  </body>
</html>
