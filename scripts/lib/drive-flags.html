<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>flags</title>
    <style>
      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-text);
      font-size: 48px;
    "
  >
    <script>
      document.documentElement.dataset.ready = 'yes'
    </script>
    <div
      data-name="Backdrop"
      data-locked=""
      style="position: absolute; inset: 24px; border: 4px solid var(--accent)"
    ></div>
    <main
      data-name="Card"
      style="
        position: relative;
        display: flex;
        gap: 48px;
        padding: 96px;
        width: 800px;
      "
    >
      <h1 data-name="Title" style="margin: 0; font-size: 72px">Flags</h1>
      <p data-name="Body" style="margin: 0">Hide me, then lock me.</p>
    </main>
    <section
      data-name="Stats"
      class="stats"
      style="display: none; margin: 0 96px"
      hidden=""
    >
      <p data-name="Frames">12 frames</p>
      <p data-name="Notes">3 notes</p>
    </section>
    <script>
      document.documentElement.dataset.ended = 'yes'
    </script>
  </body>
</html>
