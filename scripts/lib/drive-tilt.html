<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>card</title>
  </head>
  <body
    style="
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-text);
    "
  >
    <div
      data-name="Card"
      style="
        width: 360px;
        height: 220px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--primary);
        color: var(--surface);
        font-size: 32px;
        font-weight: 700;
        transform: perspective(800px) rotateX(20deg) rotateY(-30deg);
      "
    >
      Card
    </div>
  </body>
</html>
