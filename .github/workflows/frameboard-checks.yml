name: Frameboard Checks

# Project-owned checks the golden verify.yml has no seat for. A tooling sync
# rewrites verify.yml, so these live here where a sync never reaches.

# The macOS job runs on a push to main and on dispatch, never on a pull
# request, so a runner shortage cannot hold a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# GitHub cancels a pending run when a newer one queues in the same group,
# and a cancelled run on main would turn grey, so a push keys on its run id.
concurrency:
  group: frameboard-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  browser-tests:
    if: github.event_name != 'push'
    name: 🧩 Browser Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The unit-tests job installs no browser, so the browser project runs
      # here instead of under test:coverage.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Browser Tests
        run: bunx vitest run --project browser

  cli-runtimes:
    if: github.event_name != 'push'
    name: 📦 CLI on Node and Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Run from outside the checkout, so the bundle cannot lean on node_modules.
      - name: Run the Bundle Outside the Repository
        run: |
          cp -r dist "$RUNNER_TEMP/frameboard-dist"
          cd "$RUNNER_TEMP"
          node frameboard-dist/cli.js --version
          bun frameboard-dist/cli.js --version

  edit-parity:
    if: github.event_name != 'push'
    name: ✂️ Edit Writer on Node and Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # bunx keeps vitest's node shebang, and --bun runs the test bodies on
      # Bun, so the two digests compare the same edits across runtimes.
      - name: Run the Property Run on Node
        run: FRAMEBOARD_EDIT_DIGEST="$RUNNER_TEMP/node.digest" bunx vitest run --project node src/server/edit/property.test.ts

      - name: Run the Property Run on Bun
        run: FRAMEBOARD_EDIT_DIGEST="$RUNNER_TEMP/bun.digest" bun --bun vitest run --project node src/server/edit/property.test.ts

      - name: Compare the Outputs
        run: cmp "$RUNNER_TEMP/node.digest" "$RUNNER_TEMP/bun.digest"

  macos:
    if: github.event_name != 'pull_request'
    name: 🍎 macOS Unit and CLI Smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # No coverage here, since the Linux unit-tests job measures it.
      - name: Run Unit Tests
        run: bunx vitest run --project node

      - name: Build
        run: bun run build

      - name: Smoke the Built CLI
        run: bash scripts/smoke-cli.sh dist

  web:
    if: github.event_name != 'push'
    name: 🌐 Landing Page Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The root gate ignores web/, so this job is the only one that builds it.
      - name: Run the Web Gate
        run: bun run check
