name: Frameboard Checks

# Project-owned checks the golden verify.yml has no seat for. A tooling sync
# rewrites verify.yml, so these live here where a sync never reaches.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frameboard-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: 🧩 Browser Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The unit-tests job installs no browser, so the browser project runs
      # here instead of under test:coverage.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Browser Tests
        run: bunx vitest run --project browser

  cli-runtimes:
    name: 📦 CLI on Node and Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Run from outside the checkout, so the bundle cannot lean on node_modules.
      - name: Run the Bundle Outside the Repository
        run: |
          cp -r dist "$RUNNER_TEMP/frameboard-dist"
          cd "$RUNNER_TEMP"
          node frameboard-dist/cli.js --version
          bun frameboard-dist/cli.js --version

  edit-parity:
    name: ✂️ Edit Writer on Node and Bun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # bunx keeps vitest's node shebang, and --bun runs the test bodies on
      # Bun, so the two digests compare the same edits across runtimes.
      - name: Run the Property Run on Node
        run: FRAMEBOARD_EDIT_DIGEST="$RUNNER_TEMP/node.digest" bunx vitest run --project node src/server/edit/property.test.ts

      - name: Run the Property Run on Bun
        run: FRAMEBOARD_EDIT_DIGEST="$RUNNER_TEMP/bun.digest" bun --bun vitest run --project node src/server/edit/property.test.ts

      - name: Compare the Outputs
        run: cmp "$RUNNER_TEMP/node.digest" "$RUNNER_TEMP/bun.digest"

  macos:
    name: 🍎 macOS Unit and CLI Smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # No coverage here, since the Linux unit-tests job measures it.
      - name: Run Unit Tests
        run: bunx vitest run --project node

      - name: Build
        run: bun run build

      # Run from an empty folder outside the checkout and any repository, so
      # the bundle cannot lean on node_modules and serve creates its own
      # .frameboard. The trap stops the server on every exit path.
      - name: Smoke the Built CLI
        run: |
          set -euo pipefail
          cp -r dist "$RUNNER_TEMP/frameboard-dist"
          cli="$RUNNER_TEMP/frameboard-dist/cli.js"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          field() { node -p "JSON.parse(require('fs').readFileSync('$1', 'utf8')).data.$2"; }

          expected=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          test "$(node "$cli" --version)" = "$expected"

          node "$cli" serve --no-open --json > serve.json 2> serve.err &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          url=
          for _ in $(seq 1 60); do
            kill -0 "$server" || { cat serve.err; echo "serve exited early"; exit 1; }
            url=$(field serve.json url 2>/dev/null) && break
            sleep 0.5
          done
          test -n "$url" || { cat serve.err; echo "serve never printed an address"; exit 1; }

          # realpath both sides, since $RUNNER_TEMP sits under the /var symlink.
          test "$(field serve.json root)" = "$(pwd -P)/.frameboard"
          curl --fail --silent "$url" | grep -q '<title>Frameboard</title>'

          node "$cli" page add home --json > page.json
          node "$cli" frame add home/hero --json > frame.json
          printf '%s\n' '<!doctype html><html><head><title>Hero</title></head><body style="font-family: Georgia, serif"><p>Hello</p></body></html>' > "$(field frame.json path)"

          node "$cli" check --json > check.json
          test "$(field check.json findings.length)" = "0"
          node "$cli" list --json | grep -q '"ref": "untitled/home/hero"'
