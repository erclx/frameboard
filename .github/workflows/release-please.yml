name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        # Empty runs release-please as usual, a tag publishes that tag alone
        description: Tag to publish
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 🏷️ Release Please
    runs-on: ubuntu-latest
    # A dispatch naming a tag republishes it, so no release is cut
    if: github.event_name == 'push' || inputs.tag == ''
    # Queues rather than cancels, since a cancel can land after the release exists and before its outputs do
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Runs before the tag exists, so a release is never cut it cannot publish
      - name: Verify the publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add the secret before a release can be cut."
            exit 1
          fi
          if ! curl -sf -H "Authorization: Bearer $NPM_TOKEN" https://registry.npmjs.org/-/whoami >/dev/null; then
            echo "::error::NPM_TOKEN did not authenticate. It is likely expired or revoked."
            exit 1
          fi

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Not GITHUB_TOKEN, which authors a bot pull request CI will not run
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: 📦 Publish
    needs: release-please
    # release-please is skipped on a tag dispatch, so the gate cannot need its success
    if: >-
      !cancelled()
      && (needs.release-please.outputs.release_created == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # The tarball ships only the gitignored dist/, so the tag is built here
      - name: Build
        run: bun run build

      - name: Verify the built version matches the tag
        run: |
          built=$(node dist/cli.js --version)
          if [ "$built" != "${TAG#v}" ]; then
            echo "::error::dist/cli.js reports $built but the tag is $TAG."
            exit 1
          fi

      # npm 10 runs prepare under --ignore-scripts, npm 11 honors the flag
      - name: Pin npm
        run: npm install -g npm@11

      - name: Publish
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-check:
    name: 🔎 Publish Check
    # A tag dispatch is the repair for the gap this reports, so it never runs there
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the newest release reached npm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check-npm-publish.sh
