name: Bug report
description: Something on the board, in the CLI, or in the skill does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `frameboard serve`
        2. Ask the agent to draw a frame
        3. ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal board folder or frame
      description: The smallest board folder or frame file that shows the problem. Paste the frame's HTML, or link a repository or gist holding the folder.
    validations:
      required: true
  - type: textarea
    id: check-output
    attributes:
      label: Check output
      description: The output of `frameboard check --json`, where a check is involved.
      render: json
  - type: input
    id: frameboard-version
    attributes:
      label: Frameboard version
      description: The output of `frameboard --version`.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node 22.12.0, or Bun 1.3.0
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1, Windows 11, Ubuntu 24.04
    validations:
      required: true
